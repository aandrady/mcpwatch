# Everything under deploy/ runs somewhere other than the project's interpreter.
#
# The package targets Python 3.14 and uv provisions it on both the Windows
# authoring box and the VPS. These files do not get that: `sinkhole.py` runs in
# python:3.13-alpine and `driver.py` runs inside the probe image, which is
# node:22-bookworm-slim carrying Python 3.11.
#
# Without this, the formatter applies PEP 758 and rewrites
# `except (A, B):` into `except A, B:` — valid on 3.14, a SyntaxError on 3.11.
# That is not hypothetical: it shipped once and the containment gate caught it
# when the canary would not start.
target-version = "py311"

line-length = 100

[lint]
# Standalone scripts that talk JSON to and from other processes. Annotating
# every `dict` payload as `dict[str, Any]` would add noise without adding a
# checkable claim, and mypy does not run over this directory.
ignore = ["ANN401"]
